name: REST Assured Docker checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f qa/api/Dockerfile -t qa-api .
      - run: |
          mkdir -p qa/api/target
          docker run --rm -v "$PWD/qa/api/target:/suite/target" qa-api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rest-assured-reports
          path: qa/api/target/surefire-reports
