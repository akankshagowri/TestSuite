name: Playwright Docker checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f qa/playwright/Dockerfile -t qa-browser .
      - name: Run parallel browser tests
        run: |
          mkdir -p qa/playwright/playwright-report qa/playwright/test-results
          docker run --rm --init --ipc=host -e CI=true             -v "$PWD/qa/playwright/playwright-report:/workspace/qa/playwright/playwright-report"             -v "$PWD/qa/playwright/test-results:/workspace/qa/playwright/test-results" qa-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-reports
          path: |
            qa/playwright/playwright-report
            qa/playwright/test-results
